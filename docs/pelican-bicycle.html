<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一只鹈鹕骑着自行车穿过海边公路的纯 SVG 2D 动画演示。">
  <title>鹈鹕骑过海风 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: #b8c8df;
      --panel: rgba(15, 28, 58, .84);
      --line: rgba(185, 220, 255, .18);
      --accent: #8be5ff;
      --accent-strong: #45c7ec;
      --warm: #ffcf7d;
      --shadow: 0 28px 90px rgba(1, 9, 26, .46);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(71, 151, 218, .26), transparent 28rem),
        linear-gradient(145deg, #081126 0%, #102549 55%, #0b162e 100%);
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(28px, 6vw, 72px) 0 44px;
    }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 22px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 28px;
      height: 1px;
      content: "";
      background: currentColor;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 4.7rem);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .lede {
      max-width: 560px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.7vw, 1.16rem);
      line-height: 1.7;
    }

    .version {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .05);
      font-size: .82rem;
      white-space: nowrap;
    }

    .scene {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .scene::after {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      content: "";
      background: linear-gradient(180deg, rgba(255, 255, 255, .06), transparent 30%, rgba(5, 14, 32, .18));
      mix-blend-mode: screen;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 420px;
    }

    .controls {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 20px;
      border-top: 1px solid var(--line);
      background: rgba(5, 13, 31, .52);
    }

    .control-copy {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: .92rem;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-strong);
      box-shadow: 0 0 0 5px rgba(69, 199, 236, .15), 0 0 22px rgba(69, 199, 236, .8);
    }

    .paused .status-dot {
      background: var(--warm);
      box-shadow: 0 0 0 5px rgba(255, 207, 125, .14);
    }

    .button-row {
      display: flex;
      gap: 10px;
    }

    button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(139, 229, 255, .42);
      border-radius: 12px;
      color: var(--ink);
      background: rgba(139, 229, 255, .1);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    button:hover {
      border-color: var(--accent);
      background: rgba(139, 229, 255, .2);
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid rgba(255, 207, 125, .9);
      outline-offset: 3px;
    }

    .notes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .note {
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(10, 24, 52, .54);
    }

    .note strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: .95rem;
    }

    .note span {
      color: var(--muted);
      font-size: .87rem;
      line-height: 1.55;
    }

    /* SVG animation helpers. The scene deliberately stays self-contained. */
    .animated,
    .animated * {
      transform-box: fill-box;
      transform-origin: center;
    }

    .cloud-drift { animation: cloud-drift 24s linear infinite; }
    .cloud-drift.slow { animation-duration: 38s; animation-delay: -16s; }
    .wheel-spin { animation: wheel-spin 1.65s linear infinite; }
    .pedal-spin { animation: wheel-spin 1.65s linear infinite reverse; }
    .rider-bob { animation: rider-bob .82s ease-in-out infinite; }
    .wing-flap { animation: wing-flap .82s ease-in-out infinite; }
    .leg-front { animation: leg-front .82s ease-in-out infinite; }
    .leg-back { animation: leg-back .82s ease-in-out infinite; }
    .scarf-tail { animation: scarf-tail .82s ease-in-out infinite; }
    .dust { animation: dust-rise 1.5s ease-out infinite; }
    .dust.delay-1 { animation-delay: -.72s; }
    .dust.delay-2 { animation-delay: -1.16s; }

    .paused .animated,
    .paused .animated * { animation-play-state: paused !important; }

    .restart .animated,
    .restart .animated * { animation: none !important; }

    @keyframes cloud-drift {
      from { transform: translateX(-70px); }
      to { transform: translateX(120px); }
    }

    @keyframes wheel-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes rider-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes wing-flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-7deg) translateY(-2px); }
    }

    @keyframes leg-front {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(24deg); }
    }

    @keyframes leg-back {
      0%, 100% { transform: rotate(22deg); }
      50% { transform: rotate(-17deg); }
    }

    @keyframes scarf-tail {
      0%, 100% { transform: rotate(2deg) translateX(0); }
      50% { transform: rotate(-8deg) translateX(-6px); }
    }

    @keyframes dust-rise {
      0% { opacity: 0; transform: translate(0, 3px) scale(.55); }
      30% { opacity: .6; }
      100% { opacity: 0; transform: translate(30px, -20px) scale(1.15); }
    }

    @media (max-width: 720px) {
      .page { width: min(100% - 20px, 1180px); }
      .intro { display: block; }
      .version { display: inline-block; margin-top: 20px; }
      .scene { border-radius: 20px; }
      svg { min-height: 280px; }
      .controls { align-items: stretch; flex-direction: column; }
      .button-row { width: 100%; }
      button { flex: 1; }
      .notes { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud-drift,
      .wheel-spin,
      .pedal-spin,
      .rider-bob,
      .wing-flap,
      .leg-front,
      .leg-back,
      .scarf-tail,
      .dust { animation-play-state: paused; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <div>
        <p class="eyebrow">SVG 2D MOTION STUDY</p>
        <h1>鹈鹕骑过海风</h1>
        <p class="lede">一只戴着蓝围巾的鹈鹕，踩着小自行车沿海岸线出发。所有图形、色彩和动作都写在这个 HTML 里，没有外部图片或脚本依赖。</p>
      </div>
      <span class="version">演示页面 v1.0.0</span>
    </header>

    <section class="scene" id="scene" aria-label="鹈鹕骑自行车的 SVG 动画">
      <svg viewBox="0 0 1200 680" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="scene-title">鹈鹕骑自行车穿过海边公路</title>
        <desc id="scene-desc">画面中鹈鹕踩着自行车向右骑行，车轮旋转，围巾和翅膀随风摆动，远处云朵缓慢移动。</desc>

        <defs>
          <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#76c8eb"/>
            <stop offset=".56" stop-color="#c5eced"/>
            <stop offset="1" stop-color="#f8dba8"/>
          </linearGradient>
          <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#3d9dc1"/>
            <stop offset="1" stop-color="#164f79"/>
          </linearGradient>
          <linearGradient id="road" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#38536c"/>
            <stop offset="1" stop-color="#172842"/>
          </linearGradient>
          <linearGradient id="feather" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#fffdf7"/>
            <stop offset="1" stop-color="#d9e5ef"/>
          </linearGradient>
          <linearGradient id="beak" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#ffc96e"/>
            <stop offset="1" stop-color="#db794e"/>
          </linearGradient>
          <filter id="sun-glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="20"/>
          </filter>
          <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
            <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#061426" flood-opacity=".32"/>
          </filter>
          <g id="wheel">
            <circle r="78" fill="none" stroke="#13263e" stroke-width="11"/>
            <circle r="66" fill="none" stroke="#6f9eb2" stroke-width="2" stroke-dasharray="3 8" opacity=".82"/>
            <g stroke="#6f9eb2" stroke-width="2" opacity=".64">
              <path d="M0-70V70M-70 0H70M-49-49L49 49M49-49L-49 49"/>
            </g>
            <circle r="9" fill="#f4c56d" stroke="#162c47" stroke-width="5"/>
          </g>
          <g id="cloud">
            <path d="M0 42c-3-29 24-48 52-35 10-30 61-31 73 5 33-9 56 13 53 39H0z" fill="#fff" opacity=".72"/>
          </g>
        </defs>

        <rect width="1200" height="680" fill="url(#sky)"/>
        <circle cx="930" cy="128" r="92" fill="#fff0bd" opacity=".46" filter="url(#sun-glow)"/>
        <circle cx="930" cy="128" r="52" fill="#fff1bd" opacity=".93"/>

        <g class="animated cloud-drift" opacity=".9">
          <use href="#cloud" x="70" y="104" transform="scale(.82)"/>
          <use href="#cloud" x="550" y="62" transform="scale(.62)"/>
        </g>
        <g class="animated cloud-drift slow" opacity=".56">
          <use href="#cloud" x="240" y="194" transform="scale(.58)"/>
          <use href="#cloud" x="840" y="214" transform="scale(.78)"/>
        </g>

        <path d="M0 348c113-50 186-51 291-9 98 39 183 40 280 1 117-47 193-41 288 2 109 50 215 38 341-24v180H0z" fill="#6ab3b2" opacity=".44"/>
        <path d="M0 382c119-42 218-26 317 9 92 33 172 29 265-10 107-45 204-34 300 10 114 52 210 39 318-21v170H0z" fill="#377d91" opacity=".54"/>
        <path d="M0 405c146-28 222 12 322 31 94 17 169 8 261-28 101-39 192-25 281 15 124 55 220 42 336-6v165H0z" fill="url(#sea)"/>
        <path d="M0 474c143-25 235-8 329 17 84 22 165 22 258-10 102-35 184-23 280 15 115 45 214 32 333-4v188H0z" fill="url(#road)"/>

        <g fill="none" stroke="#a5e4e2" stroke-linecap="round" opacity=".62">
          <path d="M56 442h154M284 454h108M462 431h178M738 462h142M955 437h176" stroke-width="5"/>
          <path d="M16 503h90M157 524h154M395 491h112M626 527h168M872 498h106" stroke-width="3"/>
        </g>
        <path d="M0 576c150-32 289-29 427 1 152 33 263 25 406-4 132-27 245-29 367-8v115H0z" fill="#0f1c32" opacity=".76"/>
        <path d="M36 611h190m74 0h190m74 0h190m74 0h190m74 0h118" fill="none" stroke="#f7d58e" stroke-width="8" stroke-linecap="round" stroke-dasharray="112 74" opacity=".78"/>

        <g class="animated dust" fill="#f5d49a">
          <circle cx="304" cy="582" r="6" opacity=".5"/>
          <circle cx="280" cy="590" r="4" opacity=".36"/>
        </g>
        <g class="animated dust delay-1" fill="#f5d49a">
          <circle cx="328" cy="585" r="5" opacity=".44"/>
        </g>
        <g class="animated dust delay-2" fill="#f5d49a">
          <circle cx="254" cy="594" r="4" opacity=".32"/>
        </g>

        <g class="animated" filter="url(#soft-shadow)">
          <g transform="translate(432 552)"><g class="wheel-spin"><use href="#wheel"/></g></g>
          <g transform="translate(685 552)"><g class="wheel-spin"><use href="#wheel"/></g></g>

          <g fill="none" stroke="#e8b85f" stroke-linecap="round" stroke-linejoin="round">
            <path d="M432 552 506 427 590 552 432 552 685 552 590 552 506 427h99" stroke-width="12"/>
            <path d="M506 427h-42M506 427l26-37M589 552l-11-83" stroke-width="11"/>
          </g>
          <path d="M590 552c19-10 45-10 61 0" fill="none" stroke="#f2c978" stroke-width="8" stroke-linecap="round"/>
          <path d="M602 469h44c16 0 27 7 33 20l-8 6h-60z" fill="#26425a" stroke="#e8b85f" stroke-width="7"/>
          <path d="M678 487c20-9 37-6 50 7l-9 9-34-3" fill="none" stroke="#e8b85f" stroke-width="8" stroke-linecap="round"/>

          <g transform="translate(590 552)">
            <g class="pedal-spin">
              <circle r="15" fill="#f1c46a" stroke="#172d45" stroke-width="6"/>
              <path d="M0 0 37-20M37-20h28M0 0l-27 18M-27 18h-28" fill="none" stroke="#f1c46a" stroke-width="7" stroke-linecap="round"/>
            </g>
          </g>
        </g>

        <g class="animated rider-bob" filter="url(#soft-shadow)">
          <path d="M542 420c-20-23-21-55-6-85 13-25 38-39 65-40 37-2 63 19 77 46 12 24 17 48 4 78-16 35-44 52-79 47-25-3-46-16-61-46z" fill="url(#feather)" stroke="#273e55" stroke-width="7"/>
          <path d="M551 386c30-18 75-9 101 15-8 35-32 59-68 61-23-10-34-35-33-76z" fill="#b7cadd" opacity=".78"/>
          <path class="wing-flap" d="M585 339c43 1 64 27 60 64-2 26-17 42-37 47-15-21-21-59-23-111z" fill="#eaf3f7" stroke="#273e55" stroke-width="7"/>
          <path d="M602 365c17 9 26 21 31 36M596 382c17 9 25 21 29 34" fill="none" stroke="#adc2d4" stroke-width="5" stroke-linecap="round"/>

          <path d="M565 320c-1-35 15-61 42-71 36-14 75 4 86 34 8 24 0 52-21 68-20 15-50 17-72 5z" fill="url(#feather)" stroke="#273e55" stroke-width="7"/>
          <path d="M671 295c45-15 84-4 126 20 11 6 10 16 0 20-48 19-92 14-129-3z" fill="url(#beak)" stroke="#273e55" stroke-width="7"/>
          <path d="M674 322c40 9 79 5 118-3-39 25-82 29-120 13z" fill="#f1a467" opacity=".78"/>
          <circle cx="654" cy="273" r="9" fill="#1a2940"/>
          <circle cx="657" cy="270" r="3" fill="#fff"/>
          <path d="M607 250c14-16 37-23 59-17-12-19-37-24-60-13-13 7-22 19-26 34z" fill="#d5e4ed"/>

          <path d="M584 328c-20 16-34 26-50 40l-31 7c-12 3-14 16-2 20 30 9 62 1 91-19z" fill="#2c5277" stroke="#273e55" stroke-width="6"/>
          <path class="scarf-tail" d="M511 395c-29 11-45 29-57 56 25-9 48-11 70-6l19-38z" fill="#4fcae1" stroke="#273e55" stroke-width="6"/>

          <g fill="none" stroke="#e98d58" stroke-width="10" stroke-linecap="round">
            <path class="leg-front" d="M566 432c-6 35 1 71 25 92"/>
            <path class="leg-back" d="M627 429c10 27 7 65-14 94"/>
          </g>
          <g fill="#f5b56b" stroke="#273e55" stroke-width="5" stroke-linejoin="round">
            <path d="M589 520l-18 15 29 2 17-10z"/>
            <path d="M613 520l-4 18 27-10 9-13z"/>
          </g>
        </g>

        <g transform="translate(102 88)" opacity=".54" fill="none" stroke="#163e58" stroke-linecap="round" stroke-width="6">
          <path d="M0 15 18 0l18 15M36 15 54 0l18 15"/>
        </g>
        <g transform="translate(1040 318) scale(.7)" opacity=".38" fill="none" stroke="#163e58" stroke-linecap="round" stroke-width="6">
          <path d="M0 15 18 0l18 15M36 15 54 0l18 15"/>
        </g>
      </svg>

      <div class="controls">
        <div class="control-copy"><span class="status-dot" aria-hidden="true"></span><span id="statusText">鹈鹕正在迎风骑行</span></div>
        <div class="button-row">
          <button id="toggleButton" type="button" aria-pressed="false">暂停动画</button>
          <button id="replayButton" type="button">重新开始</button>
        </div>
      </div>
    </section>

    <section class="notes" aria-label="动画组成">
      <div class="note"><strong>自行车</strong><span>车轮、辐条和脚踏使用独立的 SVG 组同步旋转。</span></div>
      <div class="note"><strong>鹈鹕</strong><span>翅膀、双腿、围巾和身体上下起伏，组成连续的骑行动作。</span></div>
      <div class="note"><strong>海边</strong><span>云层、海浪和道路虚线用纯 CSS 动画制造纵深与速度感。</span></div>
    </section>
  </main>

  <script>
    (() => {
      const scene = document.getElementById('scene');
      const toggleButton = document.getElementById('toggleButton');
      const replayButton = document.getElementById('replayButton');
      const statusText = document.getElementById('statusText');

      const setPaused = (paused) => {
        scene.classList.toggle('paused', paused);
        toggleButton.setAttribute('aria-pressed', String(paused));
        toggleButton.textContent = paused ? '继续动画' : '暂停动画';
        statusText.textContent = paused ? '鹈鹕停在海风里' : '鹈鹕正在迎风骑行';
      };

      toggleButton.addEventListener('click', () => {
        setPaused(!scene.classList.contains('paused'));
      });

      replayButton.addEventListener('click', () => {
        const wasPaused = scene.classList.contains('paused');
        scene.classList.add('restart');
        requestAnimationFrame(() => {
          scene.classList.remove('restart');
          setPaused(wasPaused);
        });
      });
    })();
  </script>
</body>
</html>
