<section class="recovery-panel" data-recovery-panel hidden aria-live="polite">
  <h2>保存你的恢复码</h2>
  <p>这 10 个恢复码只显示这一次。请将它们保存到安全的地方；无法使用 Passkey 时，每个码可以登录一次。</p>
  <ol class="recovery-codes" data-recovery-codes></ol>
  <label class="recovery-confirm"><input type="checkbox" data-recovery-saved> 我已妥善保存恢复码</label>
  <button type="button" class="primary" data-recovery-continue disabled>完成并继续</button>
</section>
