{% extends "base.html" %}
{% block title %}旧版 Windows 配对{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">兼容连接</p><h1>旧版 Windows 配对</h1><p class="muted">在旧版 Windows 应用中填写下面的地址和一次性配对码。</p></div><a class="back-link" href="/enroll">返回新版连接方式</a></div>
<section class="card narrow-card"><label class="field-label" for="cloud-address">Cloud 地址</label><div class="copy-field"><input id="cloud-address" value="{{ public_url }}" readonly><button type="button" class="secondary" data-copy="cloud-address">复制</button></div>
{% if code %}<label class="field-label" for="legacy-code">一次性配对码</label><div class="copy-field"><input id="legacy-code" value="{{ code }}" readonly><button type="button" class="secondary" data-copy="legacy-code">复制</button></div>{% endif %}
<p class="hint">十分钟内有效，只能使用一次。请只在自己的电脑上输入。</p><form method="post" action="/devices/enroll" class="controls"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit" class="secondary">{{ '重新生成配对码' if code else '生成配对码' }}</button><a class="button-link" href="/devices">查看我的电脑</a></form></section>
{% endblock %}
