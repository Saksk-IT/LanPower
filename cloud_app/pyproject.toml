[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lanpower-cloud"
version = "1.20.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "Jinja2>=3.1.6,<4",
    "uvicorn>=0.35,<1",
    "websockets>=15,<17",
    "webauthn==3.0.1",
    "qrcode==8.2",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<10"]

[project.scripts]
lanpower-cloud = "cloud_app.cli:main"

[tool.setuptools]
packages = ["cloud_app", "cloud_app.app"]

[tool.setuptools.package-dir]
cloud_app = "."
"cloud_app.app" = "app"

[tool.setuptools.package-data]
cloud_app = ["alembic.ini", "migrations/*.py", "migrations/versions/*.py", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["cloud_app/tests"]
