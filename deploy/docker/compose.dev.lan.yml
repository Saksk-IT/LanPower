# LAN deployment configuration version: 1.1.0.
# Use start-dev.ps1 to select a physical private IPv4 address.
services:
  cloud:
    environment:
      LANPOWER_ADDITIONAL_ORIGINS: http://${LANPOWER_DEV_LAN_IP:?Run start-dev.ps1 to select a LAN address}:8080
  caddy:
    labels:
      io.lanpower.dev.network-version: "1.1.0"
    ports:
      - ${LANPOWER_DEV_LAN_IP:?Run start-dev.ps1 to select a LAN address}:8080:80
