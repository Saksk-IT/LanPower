name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Windows LAN API tests
        run: python -m unittest discover -s source/tests -v
      - name: Windows application build
        run: dotnet build windows/LanPower.sln -c Release
      - name: Windows unit tests
        run: dotnet test windows/LanPower.sln -c Release --no-build
      - name: Windows service and IPC tests
        run: dotnet run --project windows/LanPower.Tests -c Release --no-build
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build Windows installer
        shell: pwsh
        run: ./windows/installer/build-installer.ps1

  cloud-and-mini-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cloud relay tests
        run: python -m unittest discover -s cloud_remote/tests -v
      - name: Install Cloud Web dependencies
        run: python -m pip install -e './cloud_app[test]'
      - name: Cloud Web tests
        run: python -m pytest cloud_app/tests -q
      - name: Cloud Compose modes
        run: |
          docker compose -f deploy/docker/compose.yml --env-file deploy/docker/.env.example config --no-env-resolution >/dev/null
          docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.legacy.yml --env-file deploy/docker/.env.example config --no-env-resolution >/dev/null
      - name: Caddy configuration
        run: docker run --rm -e LANPOWER_PUBLIC_URL=https://power.example.com -v "$PWD/deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Cloud container build
        run: docker build -f cloud_app/Dockerfile -t lanpower-cloud:ci .
      - name: Mini program tests
        run: node tests/test_mini_program.js
      - name: Mini program v2 tests
        run: node tests/test_mini_program_v2.js

  router-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: router_gateway/go.mod
      - name: Shell syntax
        run: for script in router_gateway/scripts/*.sh; do sh -n "$script"; done
      - name: Installer integration tests
        run: python -m unittest discover -s router_gateway/tests -v
      - name: Go tests
        working-directory: router_gateway
        run: go test ./...
      - name: Go vet
        working-directory: router_gateway
        run: go vet ./...
      - name: Static Linux ARM64 build
        working-directory: router_gateway
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/lanpower-gateway" ./cmd/lanpower-gateway
