<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="电脑电源">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <title>电脑电源</title>
  <script defer src="/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-icon" aria-hidden="true">⏻</div>
      <div>
        <p class="eyebrow">LAN POWER</p>
        <h1>电脑电源</h1>
      </div>
    </header>

    <section class="device-card" aria-live="polite">
      <div class="device-topline">
        <p class="label">我的 Windows 电脑</p>
        <span id="status-pill" class="status-pill checking"><span class="status-dot"></span><span id="status-text">正在连接</span></span>
      </div>
      <div class="device-symbol" aria-hidden="true">
        <div class="display"><span class="display-power">⏻</span></div>
        <div class="stand"></div>
      </div>
      <p id="device-name" class="device-name">正在检查连接…</p>
      <p id="device-detail" class="device-detail">请确保 iPhone 与电脑连接同一个局域网</p>
    </section>

    <section id="pair-panel" class="pair-panel hidden" aria-labelledby="pair-title">
      <h2 id="pair-title">配对这台 iPhone</h2>
      <p>请在电脑上打开配对页面并扫码；也可以粘贴配对密钥。</p>
      <div class="pair-row">
        <input id="pair-input" type="password" autocomplete="off" spellcheck="false" placeholder="64 位配对密钥" aria-label="配对密钥">
        <button id="pair-button" type="button" class="small-button">保存</button>
      </div>
      <p id="pair-error" class="error-text" role="alert"></p>
    </section>

    <section class="controls" aria-labelledby="controls-title">
      <div class="section-heading">
        <h2 id="controls-title">电源控制</h2>
        <span>仅限同一局域网</span>
      </div>
      <div class="actions">
        <button class="action" type="button" data-action="sleep" disabled>
          <span class="action-symbol" aria-hidden="true">☾</span><span class="action-copy"><strong>睡眠</strong><small>快速恢复</small></span><span class="chevron" aria-hidden="true">›</span>
        </button>
        <button class="action" type="button" data-action="hibernate" disabled>
          <span class="action-symbol" aria-hidden="true">◐</span><span class="action-copy"><strong>休眠</strong><small>保存工作状态</small></span><span class="chevron" aria-hidden="true">›</span>
        </button>
        <button class="action" type="button" data-action="restart" disabled>
          <span class="action-symbol" aria-hidden="true">↻</span><span class="action-copy"><strong>重启</strong><small>重新启动 Windows</small></span><span class="chevron" aria-hidden="true">›</span>
        </button>
        <button class="action danger" type="button" data-action="shutdown" disabled>
          <span class="action-symbol" aria-hidden="true">⏻</span><span class="action-copy"><strong>关机</strong><small>可用小程序再次开机</small></span><span class="chevron" aria-hidden="true">›</span>
        </button>
      </div>
      <p id="feedback" class="feedback" role="status"></p>
    </section>

    <section class="wake-note">
      <span class="wake-icon" aria-hidden="true">⌁</span>
      <div><strong>关机后如何开机？</strong><p>在 iPhone 微信中打开我们自己的“电脑电源”小程序，点击“开机”。它会向这台电脑发送网络唤醒包。</p></div>
    </section>

    <footer>
      <button id="refresh-button" type="button">刷新状态</button>
      <span aria-hidden="true">·</span>
      <button id="forget-button" type="button">清除配对</button>
    </footer>
  </main>
</body>
</html>
